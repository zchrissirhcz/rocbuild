# arche.ini — arche 的构建描述文件。
#
# 这是一个最小示例，用来验证仓库里的 arche.py 可以正常工作：
#   python arche.py          # 构建全部目标
#   python arche.py hello    # 只构建 hello
#
# 实际项目请把本文件复制到工程根目录，并按下面的格式改成自己的目标。
# 每个 [节名] 定义一个目标；[*] 是全局设置节（参考 EditorConfig 的约定）。
# 全局节 [*] 不占用任何目标名，所以 build、arche、clean、list 等都可以作为目标名。
#
# sources 支持逗号、空白、换行和通配符，例如：
#   sources = src/a.cpp, src/b.cpp
#   sources =
#       src/a.cpp
#       src/b.cpp
#   sources = src/*.cpp
#
# 路径可以写成变量，变量在 [*] 里定义，目标用 ${NAME} 引用：
#   [*]
#   var.SDK_INC = C:\SDK\include
#   [app]
#   include_dirs = ${SDK_INC}
#
# 目标类型（type）：
#   exe     可执行文件（默认）
#   static  静态库
#   shared  动态库（Windows DLL / Linux、Android .so）
#
# 工具链也在 [*] 里配置：
#   toolchain = auto     # 默认：Windows 用 MSVC，Linux 用 GCC
#   toolchain = msvc     # 或 gcc / clang
#   toolchain = android-ndk  # 配合 ndk/api/abi/stl 交叉编译
#
# 依赖（requires）：写其他目标的名字。arche 会先构建依赖，
# 自动把依赖的头文件目录传递给当前目标，并把库产物链接进来。
#
# 完整语法见 docs/arche-ini.md，示例见 examples/。

[hello]
type = exe
sources = examples/01-hello-cli/hello.cpp
