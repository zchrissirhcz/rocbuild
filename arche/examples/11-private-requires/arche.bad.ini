# 反例：app_bad.cpp 直接 include cici.h；因为 cici 是 foo 的私有依赖，
# app 的 include 路径里没有 cici/include，编译应当失败。
[cici]
type = interface
include_dirs = cici/include

[foo]
type = static
sources = foo/src/foo.cpp
include_dirs = foo/include
private_requires = cici

[app-bad]
type = exe
sources = app_bad.cpp
requires = foo
