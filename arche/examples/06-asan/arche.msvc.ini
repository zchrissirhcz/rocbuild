# MSVC 的 ASan：编译加 /fsanitize=address，链接加 /ignore:4300。
# config = debug 会自动补 /Od /Z7 /MDd 和链接 /DEBUG /PDB。
# arche 会把 clang_rt.asan_dynamic*.dll 自动复制到 exe 旁边。
[*]
config = debug
flags = /fsanitize=address
ldflags = /ignore:4300
defines = _DISABLE_VECTOR_ANNOTATION _DISABLE_STRING_ANNOTATION

[app]
type = exe
sources = main.cpp
