# OpenCL 示例：在 [*] 里硬编码 SDK 路径变量。
# 把下面两行改成你机器上的 OpenCL SDK 路径（变量值含空格不需要引号）。
[*]
std = c++17
defines = CL_TARGET_OPENCL_VERSION=300

# Windows / 通用：改成你的 OpenCL SDK 路径（变量值含空格不需要引号）
var.SDK_INC = C:\path\to\OpenCL\include
var.SDK_LIB = C:\path\to\OpenCL\lib

# Linux：改用下面两行
# var.SDK_INC = /usr/include
# var.SDK_LIB = /usr/lib/x86_64-linux-gnu

# 如果 OpenCL.dll 不在 System32，定义 SDK_BIN 并取消下面的 copy_dlls 注释
# var.SDK_BIN = C:\path\to\OpenCL-ICD-Loader\bin

[opencl-info]
type = exe
sources = opencl_info.cpp
include_dirs = ${SDK_INC}
lib_dirs = ${SDK_LIB}
libs = OpenCL
# copy_dlls = ${SDK_BIN}
