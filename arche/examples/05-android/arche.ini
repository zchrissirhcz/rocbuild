# Android NDK 交叉编译示例。
# 把 ndk 改成你的 NDK 根目录；abi 可选：
#   arm64-v8a / armeabi-v7a / x86 / x86_64
[*]
toolchain = android-ndk
ndk = C:\soft\toolchains\android-ndk\r27c
api = 21
abi = arm64-v8a
stl = c++_static
std = c++17
config = release

[greet]
type = shared
sources = src/greet.cpp
include_dirs = include

[app]
type = exe
sources = src/main.cpp
requires = greet
