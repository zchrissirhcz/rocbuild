# 动态库 + 可执行文件。
#
# Windows 下生成 greet.dll 和导入库 greet.lib；app 链接导入库，
# arche 会把 greet.dll 自动复制到 app 的产物目录。
# Linux 下生成 libgreet.so；app 会自动设置 rpath。
[*]
std = c++17

[greet]
type = shared
sources = src/greet.cpp
include_dirs = include
defines = GREET_BUILD

[app]
type = exe
sources = src/main.cpp
requires = greet
