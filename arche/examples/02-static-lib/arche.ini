# 静态库 + 可执行文件，演示目标依赖和多源文件。
#
# app 依赖 mathx；构建 app 时会自动先构建 mathx。
# mathx 的 include_dirs 会传递给 app，所以 app 不需要重复写 include。
[*]
std = c++17
config = release

# mathx 由两个源文件组成。逗号、空白、换行都可用于分隔 sources。
[mathx]
type = static
sources = src/mathx.cpp, src/stats.cpp
include_dirs = include

# app 也由两个源文件组成；这里用换行写法，和上面的逗号写法等价。
[app]
type = exe
sources =
    src/main.cpp
    src/report.cpp
requires = mathx
