# 直接写法：补丁把适配器源码和头文件目录直接加到 app，
# 适合外部预编译 SDK 或一次性包装。
[*]
choice.NPU = npu_a
choice.NPU.values = npu_a, npu_b

[app]
type = exe
sources = app/main.cpp

[app:NPU=npu_a]
defines = USE_NPU_A=1
sources = npu_a/src/npu_a.cpp
include_dirs = npu_a/include

[app:NPU=npu_b]
defines = USE_NPU_B=1
sources = npu_b/src/npu_b.cpp
include_dirs = npu_b/include
