# OOP 写法：npu_a / npu_b 是真正的静态适配库，
# app 的补丁只负责选择适配器并定义宏。
[*]
choice.NPU = npu_a
choice.NPU.values = npu_a, npu_b

[npu_a]
type = static
sources = npu_a/src/npu_a.cpp
include_dirs = npu_a/include

[npu_b]
type = static
sources = npu_b/src/npu_b.cpp
include_dirs = npu_b/include

[app]
type = exe
sources = app/main.cpp

[app:NPU=npu_a]
defines = USE_NPU_A=1
requires = npu_a

[app:NPU=npu_b]
defines = USE_NPU_B=1
requires = npu_b
